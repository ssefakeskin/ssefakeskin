<svg xmlns="http://www.w3.org/2000/svg" width="420" height="180" viewBox="0 0 420 180" role="img" aria-label="Activity">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1220"/><stop offset="1" stop-color="#0D1117"/></linearGradient>
    <linearGradient id="ac" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22D3EE"/><stop offset="1" stop-color="#818CF8"/></linearGradient>
  </defs>
  <style>
    .t{font:600 15px 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif;fill:#E6EDF3;letter-spacing:.3px}
    .l{font:400 13px 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif;fill:#8B949E}
    .v{font:700 24px 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif;fill:#F0F6FC}
    .m{font:500 12px ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace;fill:#8B949E}
    .fade{opacity:0;animation:in .6s ease forwards}
    @keyframes in{to{opacity:1}}
    @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  </style>
  <rect x=".5" y=".5" width="419" height="179" rx="14" fill="url(#bg)" stroke="#21262D"/>
  <rect x="24" y="22" width="4" height="16" rx="2" fill="url(#ac)"/>
  <text x="36" y="35" class="t">Activity</text>
  <g class="fade" style="animation-delay:0ms">
    <rect x="24" y="60" width="180" height="46" rx="10" fill="#161B22" stroke="#21262D"/>
    <text x="38" y="89" class="v">106</text>
    <text x="190" y="88" class="l" text-anchor="end">Commits</text>
  </g><g class="fade" style="animation-delay:120ms">
    <rect x="220" y="60" width="180" height="46" rx="10" fill="#161B22" stroke="#21262D"/>
    <text x="234" y="89" class="v">11</text>
    <text x="386" y="88" class="l" text-anchor="end">Repositories</text>
  </g><g class="fade" style="animation-delay:240ms">
    <rect x="24" y="116" width="180" height="46" rx="10" fill="#161B22" stroke="#21262D"/>
    <text x="38" y="145" class="v">3</text>
    <text x="190" y="144" class="l" text-anchor="end">Team projects</text>
  </g><g class="fade" style="animation-delay:360ms">
    <rect x="220" y="116" width="180" height="46" rx="10" fill="#161B22" stroke="#21262D"/>
    <text x="234" y="145" class="v">5</text>
    <text x="386" y="144" class="l" text-anchor="end">Languages</text>
  </g><text x="396" y="35" class="m" text-anchor="end">since Dec 2025</text>
</svg>